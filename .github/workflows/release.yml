name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Releasing the current main tip lets an earlier run include back-to-back merges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - name: Realize pinned version tools once
        run: |
          time nix build .#release-tools --out-link result-release-tools --print-build-logs
          echo "$PWD/result-release-tools/bin" >> "$GITHUB_PATH"
          {
            echo "SSL_CERT_FILE=$PWD/result-release-tools/etc/ssl/certs/ca-bundle.crt"
            echo "UV_PYTHON=$PWD/result-release-tools/bin/python3.14"
            echo "UV_PYTHON_DOWNLOADS=never"
          } >> "$GITHUB_ENV"
      # PSR 10.6.1 uses Actor.name_email_regex, which GitPython 3.1.60 removed.
      - name: Semantic Release (version only)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv tool run
          --from 'python-semantic-release==10.6.1'
          --with 'gitpython<3.1.60'
          semantic-release -v version --no-vcs-release

  nix:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/nix-verify.yml
    with:
      ref: v${{ needs.version.outputs.version }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  images:
    needs: [version, nix]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-x64-images
          path: dist
      - name: Prepare pinned publishing tools
        run: |
          time nix build .#ci-tools --out-link result-ci-tools --print-build-logs
          echo "$PWD/result-ci-tools/bin" >> "$GITHUB_PATH"
          echo "SSL_CERT_FILE=$PWD/result-ci-tools/etc/ssl/certs/ca-bundle.crt" >> "$GITHUB_ENV"
      - name: Publish verified release images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          cleanup_auth() { rm -f "$REGISTRY_AUTH_FILE"; }
          trap cleanup_auth EXIT
          printf "%s" "$REGISTRY_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$REGISTRY_USER" --password-stdin ghcr.io
          bash scripts/publish-images.sh "$VERSION" latest

  publish:
    needs: [version, images]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - name: Realize pinned publishing tools once
        run: |
          time nix build .#ci-tools --out-link result-ci-tools --print-build-logs
          time nix build .#release-tools --out-link result-release-tools --print-build-logs
          {
            echo "$PWD/result-ci-tools/bin"
            echo "$PWD/result-release-tools/bin"
          } >> "$GITHUB_PATH"
          {
            echo "SSL_CERT_FILE=$PWD/result-ci-tools/etc/ssl/certs/ca-bundle.crt"
            echo "UV_PYTHON=$PWD/result-release-tools/bin/python3.14"
            echo "UV_PYTHON_DOWNLOADS=never"
          } >> "$GITHUB_ENV"
      - name: Build wheel
        run: uv build
      - name: Push Helm chart to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf "%s" "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm package charts/carapace --version "$VERSION" --app-version "$VERSION"
          helm push "carapace-${VERSION}.tgz" "oci://ghcr.io/${REGISTRY_OWNER}/charts"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          notes=$(awk '/^## v'"${VERSION}"'/{found=1; next} /^## v[0-9]/{if(found) exit} found' CHANGELOG.md)
          notes="${notes}

          ## Docker Images

          \`\`\`
          docker pull ghcr.io/${REGISTRY_OWNER}/carapace:${VERSION}
          docker pull ghcr.io/${REGISTRY_OWNER}/carapace-frontend:${VERSION}
          docker pull ghcr.io/${REGISTRY_OWNER}/carapace-sandbox:${VERSION}
          docker pull ghcr.io/${REGISTRY_OWNER}/carapace-bitwarden-cli:${VERSION}
          \`\`\`

          ## Helm Chart

          \`\`\`
          helm install carapace oci://ghcr.io/${REGISTRY_OWNER}/charts/carapace --version ${VERSION}
          \`\`\`"
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${VERSION}" \
            --notes "$notes"
