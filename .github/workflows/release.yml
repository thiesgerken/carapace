name: Release

# A push to main prepares the release commit with Presswerk (https://presswerk.dev/guide/github-actions/),
# pushes it, verifies exactly that commit and only then publishes it, all in the same run. Presswerk's
# documented flow dispatches a separate candidate run instead. That run would wait in the concurrency
# group, where GitHub cancels a waiting run as soon as a newer one queues, so a merge right after a
# release would drop the candidate and block every later release until someone re-dispatches it.
# Dispatching a candidate by hand recovers a release whose run failed or was cancelled.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the release commit to verify and publish
        type: string
        required: true

permissions:
  contents: read

# One release at a time. A newer push replacing a waiting push run loses nothing, since the newer run
# releases everything on main. A stale push run's push of its release commit is rejected (no force).
concurrency: presswerk-release

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - name: Prepare the release commit
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main moved on; the newer push run prepares"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          nix run --inputs-from . presswerk -- prepare
          if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
            git push origin HEAD:main
            echo "candidate=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Pushes the Nix images and the chart to Cachix, where the publish job fetches them.
  # prepare is skipped on a dispatch, so only its failure or an empty candidate stops this job.
  verify:
    needs: prepare
    if: ${{ !failure() && !cancelled() && (inputs.candidate || needs.prepare.outputs.candidate) }}
    uses: ./.github/workflows/nix-verify.yml
    with:
      ref: ${{ inputs.candidate || needs.prepare.outputs.candidate }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    needs: [prepare, verify]
    if: ${{ !failure() && !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate || needs.prepare.outputs.candidate }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      # Pushes the tag, the images, the chart and the GitHub Release; GITHUB_ACTOR is the registry user.
      # The tag is annotated, so it needs a tagger identity.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          nix run --inputs-from . presswerk -- publish HEAD
