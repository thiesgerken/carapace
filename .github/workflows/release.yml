name: Release

# Presswerk's push run / candidate run flow (https://presswerk.dev/guide/github-actions/). A push to
# main prepares the release commit, pushes it and dispatches this workflow with it as the candidate.
# The candidate run verifies exactly that commit and only then publishes it. Pushes made with
# GITHUB_TOKEN start no workflow runs, hence the dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate:
        description: Full SHA of the release commit to verify and publish
        type: string
        required: true

permissions:
  contents: read

# One release at a time. A stale push run's push of its release commit is rejected (no force).
concurrency: presswerk-release

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - name: Prepare the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$GITHUB_SHA"; then
            echo "main moved on; the newer push run prepares"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # v0.183.5 was released by python-semantic-release, so it has no declaration to verify.
          # It stays the previous release until the first Presswerk release commit bumps the version.
          trust=()
          if test "$(nix eval --raw .#presswerk.default.version)" = 0.183.5; then
            trust=(--trust-predecessor v0.183.5=dec701d9fc02a3f145f6e541bac949440fea392f)
          fi
          nix run --inputs-from . presswerk -- prepare "${trust[@]}"
          if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
            git push origin HEAD:main
            gh workflow run release.yml --ref main -f candidate="$(git rev-parse HEAD)"
          fi

  # Pushes the Nix images and the chart to Cachix, where the publish job fetches them, and uploads
  # the verified sandbox archive.
  verify:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/nix-verify.yml
    with:
      ref: ${{ inputs.candidate }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: thiesgerken
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-x64-images
          path: ${{ runner.temp }}/verified
      # The sandbox is a Dockerfile build, not a store path, so Presswerk can't publish it. It goes
      # first, so a failed push leaves no tag behind.
      - name: Push the verified sandbox image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          nix build .#ci-tools --out-link result-ci-tools
          export PATH="$PWD/result-ci-tools/bin:$PATH"
          export SSL_CERT_FILE="$PWD/result-ci-tools/etc/ssl/certs/ca-bundle.crt"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/skopeo-auth.json"
          cleanup_auth() { rm -f "$REGISTRY_AUTH_FILE"; }
          trap cleanup_auth EXIT
          printf "%s" "$REGISTRY_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" --username "$REGISTRY_USER" --password-stdin ghcr.io
          mkdir dist
          mv "$RUNNER_TEMP/verified/carapace-sandbox.tar.gz" dist/
          bash scripts/publish-images.sh "$(nix eval --raw .#presswerk.default.version)" latest
      # Pushes the tag, the images, the chart and the GitHub Release; GITHUB_ACTOR is the registry user.
      # The tag is annotated, so it needs a tagger identity.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          nix run --inputs-from . presswerk -- publish HEAD
