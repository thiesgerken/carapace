name: CI

on:
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - run: uv run pyrefly check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: uv sync --dev
      - run: uv run pytest

  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - run: helm lint charts/carapace

  docker-backend:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:pr${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}:pr${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:pr${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}-frontend:pr${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-sandbox:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: sandbox
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-sandbox:pr${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}-sandbox:pr${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-bitwarden-cli:
    runs-on: ubuntu-latest
    needs: [backend-lint, test]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute short SHA
        id: vars
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: bitwarden-cli
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-bitwarden-cli:pr${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}-bitwarden-cli:pr${{ github.event.pull_request.number }}-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-publish-pr:
    runs-on: ubuntu-latest
    needs:
      [
        helm-lint,
        docker-backend,
        docker-frontend,
        docker-sandbox,
        docker-bitwarden-cli,
      ]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Package PR Helm chart
        id: package
        run: |
          base_version=$(awk -F '"' '/^version = "/ { print $2; exit }' pyproject.toml)
          pr_number='${{ github.event.pull_request.number }}'
          short_sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)
          chart_version="${base_version}-pr.${pr_number}"
          chart_version_sha="${chart_version}.${short_sha}"
          app_version="pr${pr_number}"
          app_version_sha="pr${pr_number}-${short_sha}"

          mkdir -p dist
          # Short version (overwritten each push) tracks the mutable prN image tag.
          # The SHA version pins immutable prN-<sha> images, so pinning ArgoCD to it
          # forces both a chart refetch and a re-pull of the actual code.
          helm package charts/carapace \
            --destination dist \
            --version "$chart_version" \
            --app-version "$app_version"
          helm package charts/carapace \
            --destination dist \
            --version "$chart_version_sha" \
            --app-version "$app_version_sha"

          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "chart_version_sha=$chart_version_sha" >> "$GITHUB_OUTPUT"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "app_version_sha=$app_version_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push PR Helm chart to GHCR
        run: |
          helm push \
            "dist/carapace-${{ steps.package.outputs.chart_version }}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts
          helm push \
            "dist/carapace-${{ steps.package.outputs.chart_version_sha }}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Upload PR Helm chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carapace-chart-pr${{ github.event.pull_request.number }}
          path: dist/carapace-*.tgz

      - name: Print PR preview tags
        run: |
          echo "::notice title=PR preview image tag::${{ steps.package.outputs.app_version }}"
          echo "::notice title=PR preview chart version::${{ steps.package.outputs.chart_version_sha }}"
          echo "Use image tag: ${{ steps.package.outputs.app_version }}"
          echo "Use chart version: ${{ steps.package.outputs.chart_version }}"
          echo "Pin to commit: ${{ steps.package.outputs.chart_version_sha }}"

          {
            echo "## PR preview artifacts"
            echo
            echo "Mutable image tag: ${{ steps.package.outputs.app_version }}"
            echo "Immutable image tag: ${{ steps.package.outputs.app_version_sha }}"
            echo
            echo "Images (mutable / immutable):"
            echo "- ghcr.io/${{ github.repository }}:${{ steps.package.outputs.app_version }} | :${{ steps.package.outputs.app_version_sha }}"
            echo "- ghcr.io/${{ github.repository }}-frontend:${{ steps.package.outputs.app_version }} | :${{ steps.package.outputs.app_version_sha }}"
            echo "- ghcr.io/${{ github.repository }}-sandbox:${{ steps.package.outputs.app_version }} | :${{ steps.package.outputs.app_version_sha }}"
            echo "- ghcr.io/${{ github.repository }}-bitwarden-cli:${{ steps.package.outputs.app_version }} | :${{ steps.package.outputs.app_version_sha }}"
            echo
            echo "Chart:"
            echo "- oci://ghcr.io/${{ github.repository_owner }}/charts/carapace --version ${{ steps.package.outputs.chart_version }} (mutable images)"
            echo "- Pin to commit (forces ArgoCD refetch + re-pull): --version ${{ steps.package.outputs.chart_version_sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
