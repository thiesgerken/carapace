[project]
name = "carapace"
version = "0.145.0"
description = "Security-first personal AI agent with rule-based information flow control"
readme = "README.md"
requires-python = ">=3.12"
# Base deps cover only the `carapace` CLI client (cli.py + payloads.py), so a
# plain `pip install carapace` is a light client install. The server, agent,
# database, and integration stack lives in the `server` extra below — install
# `carapace[server]` to run carapace-server / carapace-migrate.
dependencies = [
    "typer>=0.23,<1",
    "rich>=15,<16",
    "httpx>=0.28,<1",
    "websockets>=16,<17",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
server = [
    "pydantic-ai>=2,<3",
    "pyyaml>=6,<7",
    "croniter>=6,<7",
    "tenacity>=9,<10",
    "logfire[httpx]>=4,<5",
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.40,<1",
    "pydantic-settings>=2,<3",
    "genai-prices>=0.0.53",
    "docker>=7,<8",
    "loguru>=0.7.3",
    "matrix-nio>=0.25,<1",
    "markdown>=3,<4",
    "kr8s>=0.20,<1",
    "tiktoken>=0.8,<1",
    "redis>=8,<9",
    "pywebpush>=2,<3",
    "joserfc>=1.6.5",
    "pwdlib[argon2]>=0.3.0",
    "types-docker>=7.1.0.20260518",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3,<4",
]

[project.scripts]
carapace = "carapace.cli:app"
carapace-server = "carapace.server:main"
carapace-migrate = "carapace.database.cli:app"

[dependency-groups]
# Dev/test/type-check needs the full server stack.
dev = [
    "carapace[server]",
    "pyrefly>=1.0.0",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.15.10",
    "types-croniter>=6.2.2.20260508",
    "types-pyyaml>=6.0.12.20260510",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carapace"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "frontend/package.json:version",
    "charts/carapace/Chart.yaml:version",
    "charts/carapace/Chart.yaml:appVersion",
]
allow_zero_version = true
commit_parser = "emoji"
build_command = """
    pip install uv
    uv lock --upgrade-package carapace
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
major_tags = ["💥", ":boom:"]
minor_tags = ["✨", ":sparkles:"]
patch_tags = [
    "🐛",
    ":bug:",
    "🚑",
    ":ambulance:",
    "♻️",
    ":recycle:",
    "⚡",
    ":zap:",
    "🔒",
    ":lock:",
    "🩹",
    ":adhesive_bandage:",
    "⬆️",
    ":arrow_up:",
    "🔧",
    ":wrench:",
    "💄",
    ":lipstick:",
    "🗑️",
    ":wastebasket:",
    "👷",
    ":construction_worker:",
]
ignore_merge_commits = false

[tool.semantic_release.changelog]
template_dir = "templates"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src"]
project-excludes = [
    "tests",
    "src/carapace/assets",
    "**/node_modules/**/*",
    "**/__pycache__",
    "**/.*",
    ".venv",
]
infer-with-first-use = false
