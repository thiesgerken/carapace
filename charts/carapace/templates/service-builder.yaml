{{- if .Values.builder.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-builder
  labels:
    {{- include "carapace.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
spec:
  selector:
    app.kubernetes.io/name: carapace
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: builder
  ports:
    - name: build-api
      port: 8330
      targetPort: build-api
{{- end }}
