{{- if and .Values.builder.enabled (not .Values.builder.auth.existingSecret) }}
{{- $name := printf "%s-builder" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := randAlphaNum 40 }}
{{- if and $existing $existing.data $existing.data.token }}
  {{- $token = $existing.data.token | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "carapace.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
