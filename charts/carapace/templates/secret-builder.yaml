{{- if and .Values.builder.enabled (not .Values.builder.auth.existingSecret) }}
{{- $name := printf "%s-builder" .Release.Name }}
{{- $builderNamespace := include "carapace.builder.namespace" . }}
{{- $token := randAlphaNum 40 }}
{{- range $namespace := uniq (list $builderNamespace $.Release.Namespace) }}
  {{- $existing := lookup "v1" "Secret" $namespace $name }}
  {{- if and $existing $existing.data $existing.data.token }}
    {{- $token = $existing.data.token | b64dec }}
  {{- end }}
{{- end }}
{{- /* The builder reads the token in its namespace, the server in the release namespace. */}}
{{- range $namespace := uniq (list $builderNamespace $.Release.Namespace) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "carapace.labels" $ | nindent 4 }}
    app.kubernetes.io/component: builder
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
{{- end }}
