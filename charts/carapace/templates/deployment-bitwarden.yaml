{{- range .Values.bitwarden.instances }}
{{- $name := include "carapace.bitwardenStandaloneName" (dict "root" $ "instance" .) }}
{{- $servePort := 8088 }}
{{- $servicePort := .port | default 80 }}
{{- $basicAuth := .basicAuth | default dict }}
{{- $basicAuthEnabled := true }}
{{- if hasKey $basicAuth "enabled" }}
{{- $basicAuthEnabled = $basicAuth.enabled }}
{{- end }}
{{- $networkPolicy := .networkPolicy | default dict }}
{{- $networkPolicyEnabled := true }}
{{- if hasKey $networkPolicy "enabled" }}
{{- $networkPolicyEnabled = $networkPolicy.enabled }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-nginx
  labels:
    {{- include "carapace.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bitwarden
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        auth_basic off;
        access_log off;
        return 204;
      }

      location / {
{{- if $basicAuthEnabled }}
        auth_basic {{ $basicAuth.realm | default "carapace-bitwarden" | quote }};
        auth_basic_user_file /etc/nginx/auth/{{ $basicAuth.secretKey | default "htpasswd" }};
{{- else }}
        auth_basic off;
{{- end }}

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:{{ $servePort }};
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "carapace.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bitwarden
spec:
  selector:
    app.kubernetes.io/name: carapace
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: bitwarden
    app.kubernetes.io/bitwarden-instance: {{ .name }}
  ports:
    - name: http
      port: {{ $servicePort }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "carapace.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bitwarden
    app.kubernetes.io/bitwarden-instance: {{ .name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: carapace
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: bitwarden
      app.kubernetes.io/bitwarden-instance: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carapace
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: bitwarden
        app.kubernetes.io/bitwarden-instance: {{ .name }}
    spec:
      {{- if or .priorityClassName $.Values.priorityClassName }}
      priorityClassName: {{ .priorityClassName | default $.Values.priorityClassName }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "carapace.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: bitwarden
          image: {{ include "carapace.bitwardenImage" $ }}
          imagePullPolicy: {{ $.Values.bitwarden.image.pullPolicy }}
          securityContext:
            {{- include "carapace.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: BW_SERVER_URL
              value: {{ .serverUrl | quote }}
            - name: BW_SERVE_PORT
              value: {{ $servePort | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: bitwarden-data
              mountPath: /var/lib/bitwarden-cli
            - name: bitwarden-creds
              mountPath: /run/secrets/bitwarden
              readOnly: true
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sS -o /dev/null --connect-timeout 2 --max-time 5 http://127.0.0.1:{{ $servePort }}/
            {{- toYaml $.Values.bitwarden.probes.bwServe.startup | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sS -o /dev/null --connect-timeout 2 --max-time 5 http://127.0.0.1:{{ $servePort }}/
            {{- toYaml $.Values.bitwarden.probes.bwServe.readiness | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - curl -sS -f -o /dev/null -X POST --connect-timeout 10 --max-time 60 http://127.0.0.1:{{ $servePort }}/sync
            {{- toYaml $.Values.bitwarden.probes.bwServe.liveness | nindent 12 }}
        - name: nginx
          image: {{ include "carapace.bitwardenNginxImage" $ }}
          imagePullPolicy: {{ $.Values.bitwarden.nginx.image.pullPolicy }}
          securityContext:
            {{- include "carapace.containerSecurityContext" $ | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            {{- if $basicAuthEnabled }}
            - name: nginx-auth
              mountPath: /etc/nginx/auth
              readOnly: true
            {{- end }}
          {{- with $.Values.bitwarden.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml $.Values.bitwarden.probes.nginx.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml $.Values.bitwarden.probes.nginx.liveness | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: bitwarden-data
        {{- if $.Values.bitwarden.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-bitwarden-{{ .name }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: bitwarden-creds
          secret:
            secretName: {{ .existingSecret }}
            defaultMode: 0400
        - name: nginx-config
          configMap:
            name: {{ $name }}-nginx
        {{- if $basicAuthEnabled }}
        - name: nginx-auth
          secret:
            secretName: {{ required "bitwarden standalone basicAuth.existingSecret is required when basic auth is enabled" $basicAuth.existingSecret }}
            defaultMode: 0444
        {{- end }}
{{- if $networkPolicyEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "carapace.labels" $ | nindent 4 }}
    app.kubernetes.io/component: bitwarden
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: carapace
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: bitwarden
      app.kubernetes.io/bitwarden-instance: {{ .name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: carapace
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
