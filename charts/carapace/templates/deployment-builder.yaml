{{- if .Values.builder.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-builder
  namespace: {{ include "carapace.builder.namespace" . }}
  labels:
    {{- include "carapace.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: carapace
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carapace
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: builder
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      automountServiceAccountToken: false
      # The Nix build sandbox needs its own namespaces: root here is an unprivileged host user,
      # /proc is unmasked so the sandbox can mount it, and seccomp/AppArmor must allow unshare.
      hostUsers: false
      securityContext:
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      initContainers:
        - name: init-store
          image: {{ include "carapace.builderImage" . }}
          imagePullPolicy: {{ .Values.builder.image.pullPolicy }}
          command: ["/bin/carapace-builder-init"]
          volumeMounts:
            - name: nix
              mountPath: /mnt/nix
      containers:
        - name: builder
          image: {{ include "carapace.builderImage" . }}
          imagePullPolicy: {{ .Values.builder.image.pullPolicy }}
          securityContext:
            procMount: Unmasked
          ports:
            - name: build-api
              containerPort: 8330
          env:
            - name: CARAPACE_BUILDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "carapace.builder.secretName" . }}
                  key: token
          volumeMounts:
            - name: nix
              mountPath: /nix
          {{- with .Values.builder.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: build-api
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: build-api
            periodSeconds: 30
      volumes:
        - name: nix
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-builder
{{- end }}
