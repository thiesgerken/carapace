# -- Container image settings
image:
  registry: ghcr.io
  repository: thiesgerken/carapace
  tag: "" # defaults to appVersion
  pullPolicy: IfNotPresent

# -- Server log level (debug, info, warning, error)
logLevel: info

frontend:
  enabled: true
  image:
    registry: ghcr.io
    repository: thiesgerken/carapace-frontend
    tag: "" # defaults to appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- Server ports
server:
  # -- API port (FastAPI / REST + WebSocket)
  apiPort: 8321
  # -- Sandbox-facing API port (Basic Auth, Git HTTP backend)
  sandboxPort: 8322
  # -- Proxy port (sandbox HTTP proxy)
  proxyPort: 3128
  probes:
    startup:
      initialDelaySeconds: 15
      periodSeconds: 5
      failureThreshold: 20
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10

sandbox:
  image:
    registry: ghcr.io
    repository: thiesgerken/carapace-sandbox
    tag: "" # defaults to appVersion
  # -- Absolute skill activator path inside the sandbox image (empty disables activation)
  skillActivator: /usr/local/bin/carapace-skill-activator
  # -- PriorityClass override for sandbox pods (empty = use global priorityClassName)
  priorityClassName: ""
  # -- Resource requests/limits for sandbox containers
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Per-session PVC settings (StatefulSet mode)
  sessionPvc:
    size: 1Gi
    # -- Leave empty to use the cluster default StorageClass
    storageClass: ""
  # -- Preferred Sandboxes CR name for sandbox StatefulSets; set to null for the release default or "" for Deployment fallback
  sandboxesName:
  # -- Number of generic warm sandboxes to keep ready for faster claims (0 disables)
  warmPoolSize: 1
  # -- Minutes of inactivity before a sandbox is automatically cleaned up
  idleTimeoutMinutes: 960

# -- Ingress configuration (Gateway API HTTPRoute)
ingress:
  enabled: true
  hostname: carapace.example.com
  # -- Gateway parent references (required when ingress is enabled)
  parentRefs:
    - name: default-gateway
  # -- Extra annotations on the HTTPRoute
  annotations: {}

# -- Persistence
persistence:
  # Data PVC (config, sessions, knowledge — server-only, no sandbox access needed)
  data:
    # -- Leave empty to use the cluster default StorageClass
    storageClassName: ""
    size: 10Gi
    # -- Finalizers to protect the PVC from accidental deletion (e.g. by ArgoCD pruning)
    finalizers: []
    # - kubernetes.io/pvc-protection

# -- Priority class name for server and frontend pods (sandbox can override via sandbox.priorityClassName)
priorityClassName: ""

# -- Server resource requests/limits
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi

# -- Overwrite existing asset files (SOUL.md, SECURITY.md, bundled skills, …)
# with the versions bundled in the container image on every startup.
resetAssets: false

# -- Standalone Bitwarden CLI proxy instance(s) for Bitwarden-compatible credential backends.
# Each entry spawns a companion Pod running `bw serve` behind an nginx Basic Auth proxy.
# Configure the matching user credential backend in Settings -> Account -> Credentials.
# Use type: bitwarden with url set to http://<release>-bitwarden-<name>:<port>
# or fullnameOverride:<port>.
#
# Example:
#   bitwarden:
#     persistence:
#       enabled: true   # set false for ephemeral Bitwarden CLI data (no PVC)
#       size: 256Mi
#       storageClassName: ""
#     instances:
#       - name: personal
#         fullnameOverride: carapace-bitwarden-personal
#         serverUrl: https://vault.example.com
#         existingSecret: carapace-bw-personal
#         basicAuth:
#           existingSecret: carapace-bitwarden-personal-basic-auth
#         # The Secret is mounted as files under /run/secrets/bitwarden (e.g. BW_MASTER_PASSWORD;
#         # BW_CLIENTID + BW_CLIENTSECRET for API key login, or BW_EMAIL for password-only login).
#         resources:
#           requests:
#             cpu: 50m
#             memory: 128Mi
#           limits:
#             memory: 256Mi
bitwarden:
  image:
    registry: ghcr.io
    repository: thiesgerken/carapace-bitwarden-cli
    tag: "" # defaults to appVersion
    pullPolicy: IfNotPresent
  probes:
    bwServe:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 5
        failureThreshold: 36
        timeoutSeconds: 6
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 6
      liveness:
        initialDelaySeconds: 30
        periodSeconds: 120
        timeoutSeconds: 65
    nginx:
      readiness:
        initialDelaySeconds: 15
        periodSeconds: 10
      liveness:
        initialDelaySeconds: 15
        periodSeconds: 30
  nginx:
    image:
      registry: docker.io
      repository: library/nginx
      tag: 1.31.4@sha256:b34848eff6db786b6b1282d3a9c3fd0b5563dfb6d261df4923378b419e0d24f0
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # -- One PVC per bitwarden instance; stores CLI device/session data so redeploys do not
  # trigger a fresh login (and provider "new device" emails). Disable for ephemeral instances.
  persistence:
    enabled: true
    size: 256Mi
    storageClassName: ""
    # -- Finalizers to protect Bitwarden CLI data PVCs from accidental deletion.
    finalizers: []
  instances: []

# -- Extra environment variables injected into the server container
# Example:
#   extraEnv:
#     - name: CARAPACE_LOG_LEVEL
#       value: debug
extraEnv: []

# -- Additional envFrom entries (secretRef / configMapRef) for the server container.
# Use this to inject API keys and other secrets from an externally managed Secret.
# Example:
#   envFrom:
#     - secretRef:
#         name: carapace-secrets
#     - configMapRef:
#         name: carapace-env
envFrom: []

redis:
  enabled: true
  image:
    registry: docker.io
    repository: library/redis
    tag: 8-alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# -- Database backend.
# When postgres.enabled is true the in-cluster Postgres below is used and `database.url`
# is ignored. For an EXTERNAL database, set postgres.enabled=false and provide
# `database.url` (a SQLAlchemy URL, e.g. postgresql+psycopg://user:pass@host:5432/carapace).
# postgres.enabled=false AND database.url empty falls back to a SQLite file on the data
# PVC (fine for the single-replica server, no extra infra).
database:
  # -- External SQLAlchemy URL. Only used when postgres.enabled is false.
  url: ""

# -- Bundled in-cluster PostgreSQL (single instance, Recreate strategy, own PVC).
postgres:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: carapace
    username: carapace
    # -- Password for the carapace DB user. Leave empty to auto-generate one and persist
    # it in the {release}-postgres Secret, reused across upgrades via a Helm `lookup`.
    # WARNING: `lookup` only works under `helm install/upgrade`. GitOps tools that render
    # with `helm template` (Argo CD, Flux) get an empty lookup and regenerate a fresh
    # random password on every sync — but Postgres only sets the password at initdb, so
    # the running DB keeps the old one and the server fails with "password authentication
    # failed". Under GitOps, set existingSecret (recommended) or an explicit password.
    password: ""
    # -- Use an externally managed Secret (SealedSecret, External Secrets, etc.) instead of
    # generating one. Recommended for GitOps. It must contain the password under passwordKey
    # and a SQLAlchemy URL under urlKey. The URL may omit the password (it is injected
    # separately as PGPASSWORD, so no URL-encoding is needed), e.g.
    # postgresql+psycopg://carapace@{release}-postgres:5432/carapace
    existingSecret: ""
    passwordKey: postgres-password
    urlKey: database-url
  persistence:
    size: 8Gi
    # -- Leave empty to use the cluster default StorageClass
    storageClassName: ""
    finalizers: []
  # -- fsGroup applied to the Postgres pod so it can write the data volume.
  podSecurityContext:
    fsGroup: 999
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
