services:
  carapace:
    image: ghcr.io/thiesgerken/carapace:${CARAPACE_IMAGE_TAG:-latest}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    tty: true
    ports:
      - "8321:8321"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - ./data:/var/lib/carapace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CARAPACE_DATA_DIR=/var/lib/carapace
      - CARAPACE_HOST_DATA_DIR=${PWD}/data
      - CARAPACE_TOKEN=${CARAPACE_TOKEN}
      - CARAPACE_LOG_LEVEL=${CARAPACE_LOG_LEVEL:-debug}
      - CARAPACE_RESET_ASSETS=false
      - CARAPACE_MATRIX_PASSWORD=${CARAPACE_MATRIX_PASSWORD:-}
      - CARAPACE_GIT_TOKEN=${CARAPACE_GIT_TOKEN:-}
      - CARAPACE_CACHE_REDIS_URL=redis://redis:6379/0
      # SQL backend. Migrations run automatically on startup.
      - CARAPACE_DATABASE_URL=postgresql+psycopg://carapace:carapace@postgres:5432/carapace
      - CARAPACE_SANDBOX_BASE_IMAGE=ghcr.io/thiesgerken/carapace-sandbox:${CARAPACE_IMAGE_TAG:-latest}
      - CARAPACE_BUILDER_URL=http://builder:8330
      - CARAPACE_BUILDER_TOKEN=${CARAPACE_BUILDER_TOKEN:?set CARAPACE_BUILDER_TOKEN in .env}
      # Enables credentials.backends.<name>.type=file for this local Compose example.
      # Only keep this enabled when users who can change backend config are trustworthy;
      # the server process reads the configured path.
      - CARAPACE_ALLOW_FILE_CREDENTIAL_BACKEND=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    networks:
      - default
      - carapace-sandbox

  # Bitwarden CLI sidecar — shares carapace's network namespace so bw serve
  # is reachable at 127.0.0.1:8087 from the carapace container.
  # Scaled to 0 by default; enable with: docker compose up -d --scale bw=1
  bw:
    image: ghcr.io/thiesgerken/carapace-bitwarden-cli:${CARAPACE_IMAGE_TAG:-latest}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    tty: true
    network_mode: service:carapace
    volumes:
      - bitwarden-cli-data:/var/lib/bitwarden-cli
    environment:
      # Empty = US cloud; sidecar reapplies only when this changes (see docs/quickstart.md).
      BW_SERVER_URL: ${BW_SERVER_URL:-}
      BW_EMAIL: ${BW_EMAIL:-}
      BW_CLIENTID: ${BW_CLIENTID:-}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:-}
      BW_MASTER_PASSWORD: ${BW_MASTER_PASSWORD:-}
    restart: unless-stopped
    scale: 0

  frontend:
    image: ghcr.io/thiesgerken/carapace-frontend:${CARAPACE_IMAGE_TAG:-latest}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
    # For extra CSP img-src origins, mount a one-line nginx snippet:
    # volumes:
    #   - ./csp-img-src.conf:/etc/nginx/csp.d/img-src.conf:ro

  proxy:
    image: traefik:v3
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
    depends_on:
      - carapace
      - frontend
    ports:
      - "3001:80"
    volumes:
      - ./docker/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carapace
      POSTGRES_USER: carapace
      POSTGRES_PASSWORD: carapace
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carapace -d carapace"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox:
    image: ghcr.io/thiesgerken/carapace-sandbox:${CARAPACE_IMAGE_TAG:-latest}
    profiles: ["build"]

  # Copies the builder image's own store paths into the store volume, which replaces /nix in the
  # builder; runs before every start, so image updates reach the volume.
  builder-init:
    image: ghcr.io/thiesgerken/carapace-builder:${CARAPACE_IMAGE_TAG:-latest}
    command: ["/bin/carapace-builder-init"]
    volumes:
      - builder-nix:/mnt/nix

  # Builds skill flakes for the server. Reachable only on the default network, never by sandboxes.
  builder:
    image: ghcr.io/thiesgerken/carapace-builder:${CARAPACE_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      builder-init:
        condition: service_completed_successfully
    environment:
      - CARAPACE_BUILDER_TOKEN=${CARAPACE_BUILDER_TOKEN:?set CARAPACE_BUILDER_TOKEN in .env}
    # The Nix build sandbox creates its own namespaces and mounts /proc. Plain Docker has no
    # per-container user namespace, so this is weaker than the chart's hostUsers: false; see
    # docs/security.md.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    volumes:
      - builder-nix:/nix

volumes:
  builder-nix:
  bitwarden-cli-data:
  pgdata:

networks:
  carapace-sandbox:
    driver: bridge
    internal: true
