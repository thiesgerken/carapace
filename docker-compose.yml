services:
  carapace:
    build: .
    tty: true
    ports:
      - "8321:8321"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    group_add:
      - ${DOCKER_GID:-0}
    volumes:
      - ./data:/var/lib/carapace
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src/carapace:/app/.venv/lib/python3.14/site-packages/carapace
    environment:
      - CARAPACE_DATA_DIR=/var/lib/carapace
      - CARAPACE_HOST_DATA_DIR=${PWD}/data
      - CARAPACE_TOKEN=${CARAPACE_TOKEN}
      - CARAPACE_LOG_LEVEL=${CARAPACE_LOG_LEVEL:-debug}
      - CARAPACE_RESET_ASSETS=false
      - CARAPACE_MATRIX_PASSWORD=${CARAPACE_MATRIX_PASSWORD:-}
      - CARAPACE_GIT_TOKEN=${CARAPACE_GIT_TOKEN:-}
      - CARAPACE_CACHE_REDIS_URL=redis://redis:6379/0
      # SQL backend. Migrations run automatically on startup.
      - CARAPACE_DATABASE_URL=postgresql+psycopg://carapace:carapace@postgres:5432/carapace
      # Enables credentials.backends.<name>.type=file for this local Compose example.
      # Only keep this enabled when users who can change backend config are trustworthy;
      # the server process reads the configured path.
      - CARAPACE_ALLOW_FILE_CREDENTIAL_BACKEND=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    networks:
      - default
      - carapace-sandbox

  # Bitwarden CLI sidecar — shares carapace's network namespace so bw serve
  # is reachable at 127.0.0.1:8087 from the carapace container.
  # Scaled to 0 by default; enable with: docker compose up -d --scale bw=1
  bw:
    build: ./bitwarden-cli
    image: carapace-bitwarden-cli:latest
    tty: true
    network_mode: service:carapace
    volumes:
      - bitwarden-cli-data:/var/lib/bitwarden-cli
    environment:
      # Empty = US cloud; sidecar reapplies only when this changes (see docs/quickstart.md).
      BW_SERVER_URL: ${BW_SERVER_URL:-}
      BW_EMAIL: ${BW_EMAIL:-}
      BW_CLIENTID: ${BW_CLIENTID:-}
      BW_CLIENTSECRET: ${BW_CLIENTSECRET:-}
      BW_MASTER_PASSWORD: ${BW_MASTER_PASSWORD:-}
    restart: unless-stopped
    scale: 0

  frontend:
    build: ./frontend

  proxy:
    image: traefik:v3.7@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
    depends_on:
      - carapace
      - frontend
    ports:
      - "3001:80"
    volumes:
      - ./docker/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: carapace
      POSTGRES_USER: carapace
      POSTGRES_PASSWORD: carapace
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carapace -d carapace"]
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox:
    build: ./sandbox
    image: carapace-sandbox:latest
    profiles: ["build"]

volumes:
  bitwarden-cli-data:
  pgdata:

networks:
  carapace-sandbox:
    driver: bridge
    internal: true
